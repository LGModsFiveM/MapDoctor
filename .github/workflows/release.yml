name: Release

# Push a tag like v1.0.0 to build LGModsMapDoctor.exe and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - run: dotnet test tests/LGMods.MapDoctor.Tests -c Release

      - name: Build the exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/LGMods.MapDoctor.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=$version -o publish

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} publish/LGModsMapDoctor.exe --title "Map Doctor ${{ github.ref_name }}" --generate-notes
